apply plugin: 'com.android.application'

android {
    namespace "com.smartclean.app"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.smartclean.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    // SmartClean ships as ONE app ("public") with a real Free/Pro feature split built in
    // (see DEVELOP.md Phase 2) — there is no separate "Pro APK". "unlocked" is a second,
    // internal-only build for QA to eyeball every Pro-locked screen without purchasing/
    // toggling anything; it must never be distributed publicly, hence the distinct app
    // name/icon/package so it can't be mistaken for the real release build even installed
    // side by side on the same test device.
    flavorDimensions "variant"
    productFlavors {
        // Named "prod" rather than "public" — the latter is a Groovy/Java reserved word and
        // unsafe as a Gradle DSL container name. This is the real release build: same app
        // name/icon/package as what ships to users.
        prod {
            dimension "variant"
            resValue "string", "app_name", "SmartClean"
            buildConfigField "boolean", "IS_UNLOCKED_TEST_BUILD", "false"
        }
        unlocked {
            dimension "variant"
            applicationIdSuffix ".unlocked"
            versionNameSuffix "-unlocked"
            resValue "string", "app_name", "SmartClean (Unlocked Test)"
            buildConfigField "boolean", "IS_UNLOCKED_TEST_BUILD", "true"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
